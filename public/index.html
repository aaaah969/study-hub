<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Study Hub</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<script>window.MathJax={tex:{inlineMath:[['$','$'],['\\(','\\)']],displayMath:[['$$','$$'],['\\[','\\]']]},svg:{fontCache:'global'},startup:{typeset:false}};</script>
<script async src="https://cdn.jsdelivr.net/npm/mathjax@3.2.2/es5/tex-svg.js"></script>
<script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/dompurify@3.1.6/dist/purify.min.js"></script>
<style>
/* VOICE everyday: a calm, encouraging study companion
   IDEA frosted glass panes on a sunlit desk: every course, summary and test is a pane you pick up
   PICTURE the readiness ring + today's plan on the dashboard; inside a course the live summary or test itself
   COLOUR mint haze ground with teal, coral and sun light behind the glass; ink teal text; night = same light over deep ink
   TYPE Outfit for headings, Inter for reading
   LAYOUT glass sidebar + content up to 1180px; under 860px the sidebar becomes a top bar and everything stacks */
:root{color-scheme:light dark;--bg:light-dark(#e6f1ee,#081416);--ink:light-dark(#0f2a2d,#e3efed);--mute:light-dark(#4b6669,#9ab3b1);--glass:light-dark(rgba(255,255,255,.56),rgba(18,36,40,.6));--glass2:light-dark(rgba(255,255,255,.82),rgba(26,48,53,.78));--edge:light-dark(rgba(255,255,255,.9),rgba(255,255,255,.1));--hair:light-dark(rgba(15,42,45,.12),rgba(255,255,255,.1));--teal:light-dark(#0b7a7c,#43c6c2);--tealbg:light-dark(rgba(11,122,124,.12),rgba(67,198,194,.16));--coral:light-dark(#d9532f,#ff8d6e);--sun:light-dark(#b98100,#f6c453);--good:light-dark(#23804a,#62d391);--bad:light-dark(#bf3b27,#ff8b7b);--b1:light-dark(rgba(36,178,170,.55),rgba(36,178,170,.26));--b2:light-dark(rgba(255,145,110,.5),rgba(255,120,90,.2));--b3:light-dark(rgba(247,206,92,.55),rgba(247,190,70,.16));--sh:0 8px 28px light-dark(rgba(20,70,70,.1),rgba(0,0,0,.35))}
:root[data-theme=light]{color-scheme:light}
:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:16px/1.55 Inter,system-ui,sans-serif;overflow-x:clip;min-height:100vh}
h1,h2,h3,h4{font-family:Outfit,system-ui,sans-serif;line-height:1.1;letter-spacing:-.01em;margin:0}
h1{font-size:clamp(30px,4vw,44px);font-weight:700;text-wrap:balance}
h2{font-size:24px;font-weight:600}
h3{font-size:19px;font-weight:600}
p{margin:0}
button,input,select,textarea{font:inherit;color:inherit}
.sky{position:fixed;inset:0;z-index:-1;overflow:hidden;background:var(--bg)}
.sky i{position:absolute;border-radius:50%;filter:blur(80px);animation:drift 26s ease-in-out infinite alternate}
.sky i:nth-child(1){width:48vw;height:48vw;left:-10vw;top:-14vw;background:var(--b1)}
.sky i:nth-child(2){width:40vw;height:40vw;right:-8vw;top:18vh;background:var(--b2);animation-delay:-9s}
.sky i:nth-child(3){width:36vw;height:36vw;left:28vw;bottom:-16vw;background:var(--b3);animation-delay:-17s}
@keyframes drift{to{transform:translate(4vw,3vh) scale(1.08)}}
@media(prefers-reduced-motion:reduce){.sky i{animation:none}}
.glass{background:var(--glass);border:1px solid var(--edge);backdrop-filter:blur(20px) saturate(1.35);-webkit-backdrop-filter:blur(20px) saturate(1.35);border-radius:20px;box-shadow:var(--sh)}
.app{display:grid;grid-template-columns:250px minmax(0,1fr);gap:20px;padding:20px;max-width:1460px;margin:0 auto}
aside{position:sticky;top:20px;height:calc(100vh - 40px);padding:18px 12px;display:flex;flex-direction:column;gap:4px;overflow-y:auto}
.brand{display:flex;align-items:center;gap:10px;padding:4px 10px 16px;font:700 21px Outfit,sans-serif}
.brand svg{flex:none}
.nav{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:12px;color:var(--ink);text-decoration:none;font-weight:500;min-height:44px;border:1px solid transparent}
.nav:hover{background:var(--tealbg)}
.nav.on{background:var(--glass2);border-color:var(--edge);font-weight:600}
.nav .dot{width:10px;height:10px;border-radius:50%;flex:none}
.nav small{margin-left:auto;color:var(--mute);font-size:13px;white-space:nowrap}
.navlabel{font-size:13px;color:var(--mute);padding:14px 12px 4px}
.sidefoot{margin-top:auto;font-size:13px;color:var(--mute);padding:12px}
main{display:flex;flex-direction:column;gap:20px;max-width:1180px;width:100%;padding-bottom:40px}
.pane{padding:22px}
.row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.between{justify-content:space-between}
.grid{display:grid;gap:20px}
.g2{grid-template-columns:minmax(0,1.15fr) minmax(0,1fr)}
.g3{grid-template-columns:repeat(auto-fill,minmax(260px,1fr))}
.mute{color:var(--mute)}
.small{font-size:14px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:0 18px;border-radius:12px;border:1px solid var(--edge);background:var(--glass2);cursor:pointer;font-weight:600;text-decoration:none;white-space:nowrap}
.btn:hover{border-color:var(--teal)}
.btn.pri{background:var(--teal);color:light-dark(#fff,#062022);border-color:transparent}
.btn.pri:hover{filter:brightness(1.08)}
.btn.ghost{background:transparent;border-color:var(--hair)}
.btn.sm{min-height:36px;padding:0 12px;font-size:14px;border-radius:10px}
.btn.danger{color:var(--bad)}
.btn:disabled{opacity:.55;cursor:wait}
:focus-visible{outline:3px solid var(--teal);outline-offset:2px}
input[type=text],input[type=password],input[type=date],input[type=number],select,textarea{background:var(--glass2);border:1px solid var(--hair);border-radius:12px;padding:10px 12px;font-size:16px;min-height:44px;width:100%}
textarea{min-height:140px;resize:vertical;line-height:1.5}
label.f{display:flex;flex-direction:column;gap:6px;font-size:14px;font-weight:600}
.drop{border:2px dashed color-mix(in srgb,var(--teal) 45%,transparent);border-radius:16px;padding:22px;text-align:center;cursor:pointer;background:var(--tealbg);transition:background .2s}
.drop.over{background:color-mix(in srgb,var(--teal) 24%,transparent)}
.drop b{display:block;font-size:17px;margin-bottom:4px}
.tabs{display:flex;gap:6px;padding:6px;border-radius:16px;overflow-x:auto}
.tab{flex:none;min-height:42px;padding:0 18px;border-radius:11px;border:0;background:transparent;cursor:pointer;font-weight:600;color:var(--mute)}
.tab.on{background:var(--glass2);color:var(--ink);box-shadow:0 2px 8px rgba(0,0,0,.06)}
.chip{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:999px;background:var(--tealbg);font-size:13px;font-weight:500;white-space:nowrap}
.chip.coral{background:color-mix(in srgb,var(--coral) 16%,transparent)}
.chip.sun{background:color-mix(in srgb,var(--sun) 18%,transparent)}
.bar{height:8px;border-radius:99px;background:var(--hair);overflow:hidden}
.bar i{display:block;height:100%;border-radius:99px;background:var(--teal)}
.kv{display:grid;grid-template-columns:repeat(auto-fit,minmax(8.5em,1fr));gap:12px}
.stat{padding:14px 16px;border-radius:16px;background:var(--glass2);border:1px solid var(--edge)}
.stat b{display:block;font:700 clamp(24px,3vw,30px) Outfit,sans-serif;white-space:nowrap}
.stat span{font-size:13px;color:var(--mute)}
.hero{display:grid;grid-template-columns:auto minmax(0,1fr);gap:28px;align-items:center}
.ring{position:relative;width:200px;height:200px}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring .lbl{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.ring .lbl b{font:700 48px Outfit,sans-serif;line-height:1}
.ring .lbl span{font-size:13px;color:var(--mute)}
.task{display:flex;gap:12px;align-items:flex-start;padding:10px 4px;border-bottom:1px solid var(--hair)}
.task:last-child{border-bottom:0}
.task input{width:22px;height:22px;margin-top:2px;accent-color:var(--teal);flex:none;cursor:pointer}
.task .t{flex:1}
.task.done .t>span{text-decoration:line-through;color:var(--mute)}
.task .go{flex:none}
.cdot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:6px;vertical-align:1px}
.ccard{display:flex;flex-direction:column;gap:12px;padding:20px;cursor:pointer;text-decoration:none;color:inherit}
.ccard:hover{border-color:var(--teal)}
.mrow{display:grid;grid-template-columns:7.5em minmax(0,1fr) 3em;gap:10px;align-items:center;font-size:14px}
.mrow em{font-style:normal;text-align:right;font-variant-numeric:tabular-nums}
.chart{display:flex;align-items:flex-end;gap:8px;height:170px;padding-top:22px}
.chart .c{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;gap:6px;max-width:56px}
.chart .c i{width:100%;border-radius:8px 8px 4px 4px;min-height:4px}
.chart .c span{font-size:13px;font-variant-numeric:tabular-nums}
.mat{padding:0;overflow:hidden}
.mat>summary{list-style:none;cursor:pointer;padding:18px 20px;display:flex;gap:14px;align-items:flex-start}
.mat>summary::-webkit-details-marker{display:none}
.mat[open]>summary{border-bottom:1px solid var(--hair)}
.mat .body{padding:20px;display:grid;gap:18px}
.md{line-height:1.65;overflow-wrap:break-word}
.md h1,.md h2,.md h3,.md h4{margin:18px 0 8px;font-size:19px}
.md p{margin:0 0 10px}
.md ul,.md ol{margin:0 0 10px;padding-left:22px}
.md li{margin:3px 0}
.md pre{background:var(--glass2);padding:12px;border-radius:10px;overflow-x:auto}
.md code{font-size:14px;overflow-wrap:anywhere}
.md table{border-collapse:collapse;display:block;overflow-x:auto}
.md td,.md th{border:1px solid var(--hair);padding:6px 10px}
.md details{background:var(--tealbg);border-radius:10px;padding:8px 12px;margin:8px 0}
.md mjx-container{overflow-x:auto;overflow-y:hidden;max-width:100%}
.terms{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:10px}
.term{padding:12px 14px;border-radius:14px;background:var(--glass2);border:1px solid var(--edge);font-size:14px}
.term b{display:block;font-size:15px}
.status{display:flex;gap:10px;align-items:center;font-size:14px;color:var(--mute)}
.spin{width:18px;height:18px;border-radius:50%;border:2.5px solid var(--hair);border-top-color:var(--teal);animation:sp 0.8s linear infinite;flex:none}
@keyframes sp{to{transform:rotate(360deg)}}
.opt{display:flex;gap:12px;align-items:flex-start;width:100%;text-align:left;padding:14px 16px;border-radius:14px;border:1.5px solid var(--hair);background:var(--glass2);cursor:pointer;min-height:52px}
.opt:hover{border-color:var(--teal)}
.opt.sel{border-color:var(--teal);background:var(--tealbg)}
.opt.right{border-color:var(--good);background:color-mix(in srgb,var(--good) 14%,transparent)}
.opt.wrong{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 12%,transparent)}
.opt .k{flex:none;width:28px;height:28px;border-radius:8px;display:grid;place-items:center;background:var(--hair);font-weight:700;font-size:14px}
.qdots{display:flex;gap:6px;flex-wrap:wrap}
.qdots button{width:34px;height:34px;border-radius:10px;border:1px solid var(--hair);background:var(--glass2);cursor:pointer;font-size:13px;font-weight:600}
.qdots button.a{background:var(--tealbg);border-color:var(--teal)}
.qdots button.c{outline:2px solid var(--teal)}
.score{font:700 clamp(48px,8vw,72px) Outfit,sans-serif;line-height:1}
.rev{padding:16px;border-radius:16px;background:var(--glass2);border:1px solid var(--edge);display:grid;gap:10px}
.rev.ok{border-left:4px solid var(--good)}
.rev.no{border-left:4px solid var(--bad)}
.rev.part{border-left:4px solid var(--sun)}
.day{padding:16px;display:flex;flex-direction:column;gap:4px}
.day.today{outline:2px solid var(--teal)}
.day.past{opacity:.78}
.day h3{font-size:17px}
.bubble{padding:12px 14px;border-radius:14px;max-width:88%}
.bubble.me{background:var(--tealbg);margin-left:auto}
.bubble.ai{background:var(--glass2);border:1px solid var(--edge)}
.banner{padding:14px 18px;border-radius:16px;display:flex;gap:12px;align-items:center;flex-wrap:wrap;background:color-mix(in srgb,var(--sun) 16%,var(--glass));border:1px solid var(--edge)}
.modal{position:fixed;inset:0;background:rgba(5,20,22,.35);display:grid;place-items:center;padding:16px;z-index:50;backdrop-filter:blur(4px)}
.modal .glass{width:min(480px,100%);padding:24px;display:grid;gap:16px;background:var(--glass2)}
.swatches{display:flex;gap:8px;flex-wrap:wrap}
.swatches button{width:36px;height:36px;border-radius:50%;border:3px solid transparent;cursor:pointer}
.swatches button.on{border-color:var(--ink)}
#toasts{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);display:grid;gap:8px;z-index:60;width:min(460px,calc(100% - 32px))}
.toast{padding:12px 16px;border-radius:14px;background:var(--glass2);border:1px solid var(--edge);box-shadow:var(--sh);backdrop-filter:blur(16px);font-size:14px}
.toast.bad{border-left:4px solid var(--bad)}
.empty{text-align:center;padding:36px 20px;display:grid;gap:12px;justify-items:center}
.steps3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;text-align:left;width:100%;max-width:760px}
.steps3 div{padding:14px;border-radius:14px;background:var(--glass2);border:1px solid var(--edge);font-size:14px}
.steps3 b{display:block;font-family:Outfit,sans-serif;font-size:17px;margin-bottom:4px}
.seg{display:flex;flex-wrap:wrap;gap:6px}
.seg button{min-height:40px;padding:0 14px;border-radius:10px;border:1px solid var(--hair);background:var(--glass2);cursor:pointer;font-weight:500}
.seg button.on{background:var(--teal);color:light-dark(#fff,#062022);border-color:transparent}
.checks{display:grid;gap:6px;max-height:220px;overflow:auto;padding:4px}
.checks label{display:flex;gap:10px;align-items:center;font-size:14px;cursor:pointer}
.checks input{width:18px;height:18px;accent-color:var(--teal)}
@media(max-width:1000px){.g2{grid-template-columns:minmax(0,1fr)}}
@media(max-width:860px){.app{grid-template-columns:minmax(0,1fr);padding:12px 16px;gap:14px}aside{position:sticky;top:8px;height:auto;flex-direction:row;align-items:center;overflow-x:auto;padding:6px;z-index:10;border-radius:16px}.brand{padding:4px 8px;font-size:18px}.brand span{display:none}.nav{flex:none;padding:8px 12px}.nav small,.navlabel,.sidefoot{display:none}}
@media(max-width:600px){.hero{grid-template-columns:minmax(0,1fr);justify-items:center;text-align:center}.ring{width:170px;height:170px}.pane{padding:16px}.steps3{grid-template-columns:minmax(0,1fr)}.mrow{grid-template-columns:6.5em minmax(0,1fr) 3em}}
</style>
</head>
<body>
<div class="sky"><i></i><i></i><i></i></div>
<div class="app">
  <aside class="glass" id="side"></aside>
  <main id="main"><div class="glass pane status"><div class="spin"></div>Opening your study hub…</div></main>
</div>
<div id="toasts"></div>
<div id="modalRoot"></div>
<input type="file" id="filePick" multiple hidden accept=".pdf,.docx,.pptx,.txt,.md,.csv,.xlsx,.xls,.png,.jpg,.jpeg,.webp,.tex">
<input type="file" id="importPick" hidden accept=".json,application/json">
<script>
{
const $=(s,r=document)=>r.querySelector(s), $$=(s,r=document)=>[...r.querySelectorAll(s)];
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>Math.random().toString(36).slice(2,10)+Date.now().toString(36).slice(-4);
const DAY=864e5;
const isoD=d=>{const x=new Date(d);return x.getFullYear()+'-'+String(x.getMonth()+1).padStart(2,'0')+'-'+String(x.getDate()).padStart(2,'0')};
const todayISO=()=>isoD(new Date());
const parseD=s=>{const [y,m,d]=String(s).split('-').map(Number);return new Date(y,(m||1)-1,d||1)};
const addDays=(s,n)=>isoD(parseD(s).getTime()+n*DAY+3600e3);
const daysUntil=s=>s?Math.round((parseD(s)-parseD(todayISO()))/DAY):null;
const fmtD=s=>parseD(s).toLocaleDateString(undefined,{weekday:'short',month:'short',day:'numeric'});
const pct=x=>Math.max(0,Math.min(100,Math.round(x)));
const COLORS=['#0e9a97','#e8643f','#d39a12','#3a78d4','#c0507c','#4c9a58','#6a7d86','#8d6a3f'];
const KIND={course:'courses',material:'materials',sheet:'sheets',quiz:'quizzes',assignment:'assignments'};
const S={courses:[],materials:[],sheets:[],quizzes:[],assignments:[],meta:{id:'meta',kind:'meta',plan:null,hours:3,planEnd:null,activity:[]}};
const ui={tab:{},run:null,builder:{},asg:{},chat:{},openMat:null,busy:{}};

/* ---------- storage: data/db.json via the local server, with a browser copy as backup ---------- */
// Every change is written to the browser at once and marked "dirty"; dirty ids are sent to the
// server and cleared only when the server confirms. The dirty list is in localStorage too, so
// changes made while the server is down survive closing the tab and are sent when it is back.
let MODE='local';
const LS='studyhub.v1',LS_DIRTY='studyhub.dirty.v1';
const timeout=(p,ms)=>Promise.race([p,new Promise((_,r)=>setTimeout(()=>r({code:'timeout'}),ms))]);
// The example plan points at example courses that are never saved, so it is never saved either.
const metaOut=()=>S.meta.plan?.demo?{...S.meta,plan:null}:S.meta;
// Transient fields (whole file text, page images) never leave memory.
const clean=e=>JSON.parse(JSON.stringify(e===S.meta?metaOut():e,(k,v)=>k==='_full'||k==='_images'?undefined:v));
let lsWarned=false;
function lsSave(){try{const c={meta:clean(S.meta)};for(const k of Object.values(KIND))c[k]=S[k].filter(e=>!e.demo).map(clean);localStorage.setItem(LS,JSON.stringify(c))}catch(e){if(!lsWarned){lsWarned=true;toast('This browser is out of storage space for its backup copy. Export a backup from the sidebar to be safe.','bad')}}}
function lsLoad(){try{const v=JSON.parse(localStorage.getItem(LS)||'null');if(v){for(const k of Object.values(KIND))S[k]=v[k]||[];S.meta={...S.meta,...(v.meta||{})}}}catch(e){}}
let dirty={put:{},del:{}};
try{const d=JSON.parse(localStorage.getItem(LS_DIRTY)||'null');if(d&&d.put&&d.del)dirty=d}catch(e){}
function dirtySave(){try{localStorage.setItem(LS_DIRTY,JSON.stringify(dirty))}catch(e){}}
const dirtyCount=()=>Object.keys(dirty.put).length+Object.keys(dirty.del).length;
const allEntities=()=>Object.values(KIND).flatMap(k=>S[k]).filter(e=>!e.demo);
const findDoc=id=>id==='meta'?S.meta:allEntities().find(e=>e.id===id);
let flushT=null,flushing=false,flushAgain=false;
function schedule(ms){clearTimeout(flushT);flushT=setTimeout(flush,ms)}
function save(e){if(!e||e.demo)return;e.updatedAt=Date.now();delete dirty.del[e.id];dirty.put[e.id]=1;dirtySave();lsSave();if(MODE==='server')schedule(700)}
function saveMeta(){save(S.meta)}
function remove(e){const arr=S[KIND[e.kind]];const i=arr.indexOf(e);if(i>=0)arr.splice(i,1);if(e.demo)return;delete dirty.put[e.id];dirty.del[e.id]=1;dirtySave();lsSave();if(MODE==='server')schedule(400)}
async function flush(){
  if(MODE!=='server')return;
  if(flushing){flushAgain=true;return}
  flushing=true;flushAgain=false;
  try{
    for(const id of Object.keys(dirty.del)){
      const r=await fetch('/api/doc/'+encodeURIComponent(id),{method:'DELETE'});
      if(!r.ok&&r.status!==400)throw{status:r.status};
      if(dirty.del[id]){delete dirty.del[id];dirtySave()}
    }
    for(const id of Object.keys(dirty.put)){
      const e=findDoc(id);if(!e){delete dirty.put[id];dirtySave();continue}
      const stamp=e.updatedAt;
      const r=await fetch('/api/doc/'+encodeURIComponent(id),{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify(clean(e))});
      if(r.status===400||r.status===413){delete dirty.put[id];dirtySave();toast('"'+(e.name||id)+'" could not be saved to the server ('+(r.status===413?'too large':'rejected')+'). It is kept in this browser.','bad');continue}
      if(!r.ok)throw{status:r.status};
      // Only clear it if nothing changed while the request was in flight.
      if(e.updatedAt===stamp){delete dirty.put[id];dirtySave()}
    }
  }catch(err){goOffline()}
  finally{flushing=false;if(MODE==='server'&&(flushAgain||dirtyCount()))schedule(flushAgain?100:4000);renderSide()}
}

// ---------- going offline and coming back ----------
let retryT=null,retryMs=3000;
function goOffline(){
  if(MODE==='local')return;
  MODE='local';renderSide();
  toast('Cannot reach the Study Hub server. Your changes are kept in this browser and will be sent when it is back.','bad');
  scheduleReconnect(3000);
}
function scheduleReconnect(ms){clearTimeout(retryT);retryMs=ms;retryT=setTimeout(reconnect,ms)}
async function reconnect(){
  clearTimeout(retryT);if(MODE==='server')return;

// Merge the server copy into what is in memory. A dirty local item wins; an item deleted here
// stays deleted; anything only one side has is kept (and sent up if it is only here).
// Existing objects are updated in place, because running AI jobs hold references to them.
async function syncWithServer(){
  let docs;
  try{const r=await timeout(fetch('/api/state'),8000);if(!r.ok)return false;({docs}=await r.json())}catch(e){return false}
  const local=new Map(allEntities().map(e=>[e.id,e]));const seen=new Set();
  for(const d of docs){
    if(d.kind==='meta'){if(!dirty.put.meta)replaceIn(S.meta,{...S.meta,...d});continue}
    if(!KIND[d.kind]||dirty.del[d.id])continue;
    seen.add(d.id);const l=local.get(d.id);
    if(!l)S[KIND[d.kind]].push(d)
    else if(!dirty.put[d.id]&&l.status!=='working'&&l.status!=='streaming')replaceIn(l,d);
  }
  if(docs.some(d=>d.kind==='course')&&hasDemo())clearDemo();
  for(const [id,l] of local)if(!seen.has(id)&&l.status!=='working'&&l.status!=='streaming'){dirty.put[id]=1}
  if(!docs.some(d=>d.kind==='meta'))dirty.put.meta=1;
  dirtySave();MODE='server';lsSave();
  if(dirtyCount())schedule(200);
  return true;
}

// At most 4 AI requests run at once (long files and several uploads run in parallel),
// and a request that fails before any text arrived is retried when the API was busy.
// The server says how many requests its AI allows at once (2 on Gemini's free tier).
let aiActive=0;const aiQueue=[];const aiSlots=()=>Math.max(1,Math.min(6,+AIINFO.concurrency||2));
async function withSlot(fn){if(aiActive>=aiSlots())await new Promise(r=>aiQueue.push(r));aiActive++;try{return await fn()}finally{aiActive--;aiQueue.shift()?.()}}
const RETRY=new Set(['rate_limited','overloaded','network']);
async function askText(input,onText,opts={}){
  for(let attempt=0;;attempt++){
    let got=false;
    try{return await withSlot(()=>askOnce(input,t=>{got=true;onText&&onText(t)},opts))}
    // Wait as long as the AI service asks (free tiers have per-minute limits), up to 3 times.
    catch(e){if(got||attempt>=3||!RETRY.has(e?.code))throw e;opts.onWait&&opts.onWait(e);await new Promise(r=>setTimeout(r,(e.retryAfter?e.retryAfter*1000:(attempt?8000:3000))+Math.random()*1000))}
  }
}
async function askOnce(input,onText,opts){
  if(!(await getAI()))throw{code:'no_ai'};
  const messages=typeof input==='string'?[{role:'user',content:input}]:input;
  const images=opts.images?await Promise.all(opts.images.map(async b=>({media_type:b.type||'image/jpeg',data:await toB64(b)}))):[];
  let r;try{r=await fetch('/api/ai',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({messages,images,tier:opts.modelTier||'default'})})}catch(e){throw{code:'network',message:'Could not reach the Study Hub server. Is it still running (npm start)?'}}
  if(!r.ok){let j={};try{j=await r.json()}catch(e){}throw{code:j.code,retryAfter:j.retryAfter,message:j.message||('AI request failed ('+r.status+')')}}
  const rd=r.body.getReader(),dec=new TextDecoder();let raw='';
  try{for(;;){const {value,done}=await rd.read();if(done)break;raw+=dec.decode(value,{stream:true});onText&&onText(cleanAI(raw).text)}}
  catch(e){throw{code:'network',message:'The connection dropped while the AI was answering. Try again.'}}
  const {text,flag,detail}=cleanAI(raw);
  if(flag==='refusal'&&!text.trim())throw{code:'refusal',message:'The AI declined to answer this one. Try rewording it or removing unrelated content.'};
  if(flag==='error'&&!text.trim())throw{code:'upstream',message:'AI error: '+(detail||'unknown')+'. Try again.'};
  if(opts.strict&&flag)throw{code:flag,message:flag==='cut_off'?'The AI reply was too long and got cut off. Try fewer questions or a shorter file.':flag==='refusal'?'The AI declined to answer this one.':'AI error: '+(detail||'unknown')+'. Try again.'};
  return flag?text+(flag==='cut_off'?'\n\n*(The answer was cut off because it was too long. Ask a follow-up to continue.)*':flag==='refusal'?'\n\n*(The AI stopped here and declined to continue.)*':'\n\n*(The answer stopped early: '+esc(detail||'AI error')+'.)*'):text;
}

async function readFile(file){
  const ext=file.name.toLowerCase().split('.').pop();
  if(/^(txt|md|csv|json|tex|html?|py|java|c|cpp|js|m|r|sql)$/.test(ext))return{text:await file.text(),images:[]};
  if(file.type.startsWith('image/'))return{text:'',images:[await shrink(file)]};
  if(ext==='pdf'){
    const L=await pdfLib();const doc=await L.getDocument({data:new Uint8Array(await file.arrayBuffer()),isEvalSupported:false}).promise;let out='';
    for(let i=1;i<=doc.numPages;i++){const p=await doc.getPage(i);const c=await p.getTextContent();out+='\n\n[Page '+i+']\n'+c.items.map(it=>it.str+(it.hasEOL?'\n':' ')).join('')}
    const images=[];const real=out.replace(/\[Page \d+\]|\s/g,'').length;
    if(real<60*Math.min(doc.numPages,4)){for(let i=1;i<=Math.min(doc.numPages,8);i++){const p=await doc.getPage(i);const vp=p.getViewport({scale:1.5});const cv=document.createElement('canvas');cv.width=vp.width;cv.height=vp.height;await p.render({canvasContext:cv.getContext('2d'),viewport:vp}).promise;images.push(await new Promise(r=>cv.toBlob(r,'image/jpeg',.82)))}return{text:'',images}}
    return{text:out.trim(),images};
  }
  if(ext==='docx'){await loadScript(CDN+'mammoth@1.6.0/mammoth.browser.min.js');const r=await window.mammoth.extractRawText({arrayBuffer:await file.arrayBuffer()});return{text:r.value,images:[]}}
  if(ext==='pptx'){await loadScript(CDN+'jszip@3.10.1/dist/jszip.min.js');const z=await window.JSZip.loadAsync(await file.arrayBuffer());const ks=Object.keys(z.files).filter(k=>/^ppt\/slides\/slide\d+\.xml$/.test(k)).sort((a,b)=>+a.match(/\d+/)[0]-+b.match(/\d+/)[0]);let out='';for(const [i,k] of ks.entries()){const x=await z.file(k).async('string');out+='\n\n[Slide '+(i+1)+']\n'+decodeXml(x.replace(/<\/a:p>/g,'\n').replace(/<[^>]+>/g,''))}return{text:out.trim(),images:[]}}
  if(ext==='xlsx'||ext==='xls'){await loadScript('https://cdn.sheetjs.com/xlsx-0.20.3/package/dist/xlsx.full.min.js');const wb=window.XLSX.read(await file.arrayBuffer());return{text:wb.SheetNames.map(n=>'[Sheet '+n+']\n'+window.XLSX.utils.sheet_to_csv(wb.Sheets[n])).join('\n\n'),images:[]}}
  throw new Error('This file type is not supported. Save it as PDF, DOCX or PPTX and add it again.');
}

function md(src){
  if(!src)return'';const maths=[];
  let s=String(src).replace(/\$\$([\s\S]+?)\$\$|\\\[([\s\S]+?)\\\]|\\\(([\s\S]+?)\\\)|\$([^\s$](?:[^$\n]*?[^\s$])?)\$/g,m=>{maths.push(m);return'@@M'+(maths.length-1)+'@@'});
  // AI text can echo whatever is inside an uploaded file, so it is only rendered as HTML when DOMPurify is loaded.
  const safe=!!window.DOMPurify;
  let h=safe&&window.marked?window.marked.parse(s):esc(s).replace(/\n/g,'<br>');
  h=h.replace(/@@M(\d+)@@/g,(_,i)=>esc(maths[+i]));
  return safe?window.DOMPurify.sanitize(h,{ADD_TAGS:['details','summary']}):h;
}

  for(const c of S.courses){
    let last=H;const ex=daysUntil(c.examDate);
    if(ex!==null&&ex<0)continue; // exam already over: nothing left to plan
    if(ex!==null)last=Math.max(0,Math.min(H,ex-1));
    const q=[];const ms=matsOf(c.id).filter(m=>m.summary);
    if(!ms.length)q.push({type:'upload',label:'Add lecture files for '+c.name,mins:15});
    ms.forEach((m,i)=>{q.push({type:'study',ref:m.id,label:'Study: '+m.summary.title,mins:40});if(i%2===1||i===ms.length-1)q.push({type:'quiz',ref:'q'+i,label:'Practice test: '+ms.slice(Math.max(0,i-1),i+1).map(x=>x.summary.title).join(' + '),scope:ms.slice(Math.max(0,i-1),i+1).map(x=>x.id),mins:25})});
    asgOf(c.id).filter(a=>!a.understood).forEach(a=>q.push({type:'assign',ref:a.id,label:'Work through: '+a.name,mins:45}));
    if(ms.length){q.push({type:'weak',ref:'w',label:'Drill weak topics',mins:30});q.push({type:'review',ref:'r',label:'Re-read all summaries and key terms',mins:40});q.push({type:'mock',ref:'m',label:'Full mock exam',mins:60})}
    const seq={last,prev:0};
    q.forEach((t,k)=>{t.courseId=c.id;t.key=c.id+':'+t.type+':'+(t.ref||k);t.id=uid();const o=old.get(t.key);if(o){t.done=o.done;t.doneAt=o.doneAt}
      items.push({t,seq,k,ideal:q.length===1?0:Math.round(k*last/(q.length-1))})});
  }
  // Spread each course evenly up to the day before its exam, keep its tasks in order,
  // and move a task to a later (or least busy) day when its ideal day is already full.
  items.sort((a,b)=>a.ideal-b.ideal||a.seq.last-b.seq.last||a.k-b.k);
  for(const it of items){const {t,seq}=it;const from=Math.min(Math.max(it.ideal,seq.prev),seq.last);let d=-1;
    for(let i=from;i<=seq.last;i++)if(load[i]+t.mins<=cap){d=i;break}
    if(d<0){d=from;for(let i=from;i<=seq.last;i++)if(load[i]<load[d])d=i}
    seq.prev=d;load[d]+=t.mins;days[d].tasks.push(t)}
  S.meta.plan={created:Date.now(),start,end,days};S.meta.planEnd=end;saveMeta();
}

async function processUpload(kind,cid,files){
  const c=course(cid);if(!c)return;if(c.demo){toast('This is the example course. Add your own course to upload files.');return}
  // Every file shows up straight away; up to 3 are read and summarized at the same time.
  const jobs=files.map((f,i)=>{const e={id:uid(),kind,courseId:cid,name:f.name.replace(/\.[^.]+$/,''),addedAt:Date.now()+i,status:'working',stage:'Waiting…'};
    if(kind==='material')e.studied=false;S[KIND[kind]].push(e);if(kind==='assignment')ui.openMat=e.id;return{f,e}});
  render();
  let next=0;
  await Promise.all(Array.from({length:Math.min(3,jobs.length)},async()=>{while(next<jobs.length){const {f,e}=jobs[next++];e.stage='Reading file…';render();
    try{
      const {text,images}=await readFile(f);
      if(!text.trim()&&!images.length)throw new Error('No readable text found in this file.');
      if(!text.trim()&&!(await imgOK()))throw new Error('This file is scanned pages, and image reading is not available here. Try a PDF with selectable text, or paste the text.');
      // Only the first 30k characters are stored, but the AI reads the whole file the first time.
      e.text=text.slice(0,30000);e._full=text;e._images=images;
      await runAI(e,c,images);
    }catch(err){e.status='error';e.error=aiErr(err);delete e.stage;render()}
    if(S[KIND[kind]].includes(e))save(e);
  }}));
}
async function runAI(e,c,images=[]){
  const text=e._full||e.text||'';e.status='working';e.error=null;
  try{
    if(e.kind==='material'){e.stage='Summarizing…';render();e.summary=normSummary(await summarize(c,e.name,text,images,s=>{e.stage=s;render()}),e.name);if(S.meta.plan)genPlan()}
    else if(e.kind==='sheet'){e.stage='Studying the question style…';render();e.profile=normProfile(await analyzeSheet(c,e.name,text,images))}
    else if(e.kind==='assignment'){e.stage='Solving…';e.status='streaming';render();const ok=images.length&&await imgOK();
      e.solution=await askText(solvePrompt(c,text||'(The assignment is in the attached images.)'),t=>{e.solution=t;const el=document.getElementById('sol-'+e.id);if(el)el.innerHTML=md(t)},{modelTier:'complex',...(ok?{images:images.slice(0,8)}:{})});
      if(S.meta.plan)genPlan()}
    e.status='ready';delete e.stage;logActivity();
  }catch(err){e.status='error';e.error=aiErr(err);delete e.stage}
  delete e._images;delete e._full;render();
}

async function importData(file){
  let j;try{j=JSON.parse(await file.text())}catch(e){toast('That file is not a Study Hub backup.','bad');return}
  const docs=Array.isArray(j?.docs)?j.docs.filter(d=>d&&typeof d==='object'&&/^[A-Za-z0-9_-]{1,80}$/.test(d.id||'')&&(KIND[d.kind]||d.kind==='meta')&&!d.demo):null;
  if(j?.app!=='study-hub'||!docs){toast('That file is not a Study Hub backup.','bad');return}
  // These fields go into the page unescaped, so a backup file must not be able to put markup in them.
  const num=v=>Number.isFinite(+v)?+v:0,okId=v=>/^[A-Za-z0-9_:-]{1,120}$/.test(String(v||''));
  docs.forEach(d=>{
    const isDate=v=>/^\d{4}-\d\d-\d\d$/.test(v||'');
    if(d.kind==='course'){if(!/^#[0-9a-f]{3,8}$/i.test(d.color||''))d.color=COLORS[0];if(!isDate(d.examDate))d.examDate=''}
    if(d.kind==='meta'&&!isDate(d.planEnd))d.planEnd=null;
    if(d.kind==='quiz'){d.pct=pct(num(d.pct));d.n=num(d.n);d.date=num(d.date)}
    if(d.addedAt!=null)d.addedAt=num(d.addedAt);
    if(d.kind==='meta'){d.hours=num(d.hours)||3;if(d.plan&&Array.isArray(d.plan.days))d.plan.days=d.plan.days.filter(x=>x&&/^\d{4}-\d\d-\d\d$/.test(x.date)).map(x=>({date:x.date,tasks:(Array.isArray(x.tasks)?x.tasks:[]).filter(t=>t&&okId(t.id)&&okId(t.courseId)).map(t=>({...t,mins:num(t.mins)}))}));else d.plan=null}
  });
  const n=docs.filter(d=>d.kind==='course').length;
  if(!(await confirmBox(`Replace everything here with this backup (${n} course${n===1?'':'s'})? Your current data will be deleted.`,'Replace')))return;
  allEntities().forEach(remove);clearDemo();ui.run=null;
  for(const d of docs){if(d.kind==='meta'){S.meta={...S.meta,...d,id:'meta',kind:'meta'};saveMeta()}else{if(d.status&&d.status!=='ready')d.status='error',d.error=d.error||'Interrupted. Retry to finish.';if(d.summary)d.summary=normSummary(d.summary,d.name);if(d.profile)d.profile=normProfile(d.profile);S[KIND[d.kind]].push(d);save(d)}}
  location.hash='dashboard';render();toast('Backup restored.');
}

  const sw=e.target.closest('.drop');if(sw){pick(sw.dataset.drop,sw.dataset.id);return}
  const el=e.target.closest('[data-act]');if(!el)return;const A=el.dataset.act,id=el.dataset.id;
  if(['studied','tick'].includes(A)&&el.tagName==='INPUT'){e.stopPropagation()}
  if(A==='studied'&&el.tagName==='INPUT'){e.preventDefault()}
  const r=ui.run;
  switch(A){
    case'addCourse':courseModal();break;
    case'editCourse':courseModal(course(id));break;
    case'demo':loadDemo();render();break;
    case'export':exportData();break;
    case'reconnect':reconnect();break;
    case'import':$('#importPick').click();break;
    case'delCourse':{const c=course(id);if(await confirmBox('Delete '+c.name+' and everything in it?')){[...matsOf(id),...sheetsOf(id),...quizOf(id),...asgOf(id)].forEach(remove);remove(c);if(ui.run?.cid===id)ui.run=null;if(S.meta.plan)genPlan();location.hash='dashboard';render()}break}
    case'tab':ui.tab[id]=el.dataset.tab;render();break;
    case'studied':{const m=S.materials.find(x=>x.id===id);if(!m)break;m.studied=!m.studied;ui.openMat=m.id;if(m.studied){m.studiedAt=todayISO();autoTick('study',m.courseId,m.id);logActivity()}else{const t=planTasks().find(x=>x.type==='study'&&x.ref===m.id);if(t){t._t.done=false;saveMeta()}}save(m);render();break}
    case'tick':{const t=planTasks().find(x=>x.id===id);if(t){t._t.done=el.checked;t._t.doneAt=el.checked?todayISO():null;if(el.checked)logActivity();if(t.type==='study'){const m=S.materials.find(x=>x.id===t.ref);if(m){m.studied=el.checked;save(m)}}saveMeta();render()}break}
    case'doTask':doTask(id);break;
    case'makePlan':{if(!S.courses.length){courseModal();break}const pe=$('#planEnd'),ph=$('#planHours');if(pe&&pe.value)S.meta.planEnd=pe.value;if(ph)S.meta.hours=+ph.value;genPlan();if(hasDemo())S.meta.plan.demo=true;location.hash='plan';render();toast('Your study plan is ready.');break}
    case'retry':{const x=S[KIND[el.dataset.kind]].find(y=>y.id===id);if(!x)break;if(!x.text){toast('Please upload the file again.');remove(x);render();break}runAI(x,course(x.courseId)).then(()=>save(x));break}
    case'delItem':{const x=S[KIND[el.dataset.kind]].find(y=>y.id===id);if(x&&await confirmBox('Delete '+x.name+'?')){remove(x);if(S.meta.plan&&x.kind!=='sheet')genPlan();render()}break}
    case'quizMat':{const m=S.materials.find(x=>x.id===id);startQuiz(course(m.courseId),{n:8,diff:'match',scope:[m.id]},'Test: '+m.summary.title);break}
    case'bset':{const b=ui.builder[id];b[el.dataset.k]=el.dataset.k==='n'?+el.dataset.v:el.dataset.v;render();break}
    case'btype':{const b=ui.builder[id];const v=el.dataset.v;b.types=b.types.includes(v)?b.types.filter(x=>x!==v):[...b.types,v];render();break}
    case'bscope':{const b=ui.builder[id];const all=matsOf(id).filter(m=>m.summary).map(m=>m.id);const cur=b.scope||all;b.scope=el.checked?[...new Set([...cur,el.dataset.m])]:cur.filter(x=>x!==el.dataset.m);if(b.scope.length===all.length)b.scope=null;break}
    case'genQuiz':{const b=ui.builder[id];if(b.scope&&!b.scope.length){toast('Pick at least one lecture.');break}startQuiz(course(id),{...b},b.n>=20?'Mock exam':'Practice test');break}
    case'genWeak':startQuiz(course(id),{n:10,diff:'match',scope:null,focus:weakTopics(id).join(', '),kind:'weak'},'Weak-topic drill');break;
    case'newQuiz':ui.run=null;render();break;
    case'closeRun':if(r&&r.phase==='answer'&&r.ans.some(x=>x!=null)&&!(await confirmBox('Quit this test? Your answers will be lost.','Quit')))break;ui.run=null;render();break;
    case'pick':{const q=r.qs[r.idx];r.ans[r.idx]=q.type==='tf'?el.dataset.v==='true':+el.dataset.v;render();break}
    case'jump':{const v=+el.dataset.v;if(v>=0&&v<r.qs.length){r.idx=v;render()}break}
    case'finish':{const left=r.ans.filter(x=>x==null||x==='').length;if(left&&!(await confirmBox(left+' question'+(left>1?'s are':' is')+' unanswered. Finish anyway?','Finish')))break;finishQuiz();break}
    case'self':{r.grades[+el.dataset.i]={score:+el.dataset.v};recordQuiz();render();break}
    case'retake':{const q=S.quizzes.find(x=>x.id===id);ui.run={cid:q.courseId,qs:q.questions.map(({mine,...x})=>x),ans:Array(q.questions.length).fill(null),idx:0,phase:'answer',grades:{},label:'Retake: '+(q.label||'test')};render();break}
    case'solvePaste':{const c=course(id);if(c.demo){toast('Add your own course to solve assignments.');break}const t=(ui.asg[id]||'').trim();if(t.length<10){toast('Paste the assignment first.');break}const a={id:uid(),kind:'assignment',courseId:id,name:t.split('\n')[0].slice(0,60)||'Assignment',addedAt:Date.now(),text:t.slice(0,30000),status:'working'};S.assignments.push(a);ui.asg[id]='';ui.openMat=a.id;runAI(a,c).then(()=>save(a));break}
    case'ask':ask(S.assignments.find(x=>x.id===id));break;
    case'asgOk':{const a=S.assignments.find(x=>x.id===id);a.understood=!a.understood;if(a.understood){autoTick('assign',a.courseId,a.id);logActivity()}save(a);render();break}
  }
});
document.addEventListener('input',e=>{const el=e.target;const A=el.dataset?.act;if(A==='typeAns'&&ui.run){ui.run.ans[ui.run.idx]=el.value;const d=$$('.qdots button')[ui.run.idx];if(d)d.classList.toggle('a',!!el.value.trim())}if(A==='asgDraft')ui.asg[el.dataset.id]=el.value;if(el.id==='keyInput')ui.keyDraft=el.value;if(A==='chatDraft')ui.chat[el.dataset.id]=el.value});
// Escape, or a click on the dimmed backdrop, cancels whichever dialog is open.
const cancelModal=()=>$('#modalRoot [data-cancel]')?.click();
$('#modalRoot').addEventListener('mousedown',e=>{if(e.target.classList.contains('modal'))cancelModal()});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&$('#modalRoot').firstChild){e.preventDefault();cancelModal();return}if(e.key==='Enter'&&e.target.dataset?.act==='chatDraft'){e.preventDefault();ask(S.assignments.find(x=>x.id===e.target.dataset.id))}if((e.key==='Enter'||e.key===' ')&&e.target.classList?.contains('drop')){e.preventDefault();pick(e.target.dataset.drop,e.target.dataset.id)}});
document.addEventListener('toggle',e=>{const d=e.target;if(d.dataset?.mat){if(d.open)ui.openMat=d.dataset.mat;else if(ui.openMat===d.dataset.mat)ui.openMat=null}},true);
document.addEventListener('dragover',e=>{const d=e.target.closest?.('.drop');if(d){e.preventDefault();d.classList.add('over')}});
document.addEventListener('dragleave',e=>{const d=e.target.closest?.('.drop');if(d)d.classList.remove('over')});
document.addEventListener('drop',e=>{const d=e.target.closest?.('.drop');if(!d)return;e.preventDefault();d.classList.remove('over');if(e.dataTransfer.files.length)processUpload(d.dataset.drop,d.dataset.id,[...e.dataTransfer.files])});
window.addEventListener('hashchange',()=>{render();window.scrollTo(0,0)});
// Warn before closing the tab while the AI is still working or a test is half done.
// (Unsaved changes are safe: they are in the browser and are sent to the server later.)
window.addEventListener('beforeunload',e=>{const busy=Object.values(KIND).some(k=>S[k].some(x=>x.status==='working'||x.status==='streaming'))||(ui.run&&ui.run.phase!=='done'&&ui.run.ans.some(a=>a!=null&&a!==''));if(busy){e.preventDefault();e.returnValue=''}});

(async()=>{
  await initStore();
  for(const k of Object.values(KIND))S[k].forEach(e=>{if(e.status&&e.status!=='ready'&&e.status!=='error'){e.status='error';e.error='Interrupted. Retry to finish.'}});
  S.materials.forEach(m=>{if(m.summary)m.summary=normSummary(m.summary,m.name)});
  S.sheets.forEach(s=>{if(s.profile)s.profile=normProfile(s.profile)});
  render();
  getAI().then(()=>render());
})();
}
</script>
</body>
</html>
